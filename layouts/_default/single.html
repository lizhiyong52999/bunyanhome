{{ define "main" }}

<section class="page-hero">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ partial "breadcrumb.html" . }}
  </div>
</section>

<section class="page-content">
  <div class="container">
    <div class="content-body">
      {{ .Content }}
    </div>

    {{/* Show quote form on contact page */}}
    {{ if eq .Layout "contact" }}
      {{ partial "quote-form.html" . }}
    {{ end }}
  </div>
</section>

{{ end }}
