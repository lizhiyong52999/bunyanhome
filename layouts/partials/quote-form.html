<form class="quote-form" id="inquiry-form" novalidate>
  <!-- Honeypot: hidden from real users, bots fill it -->
  <div style="position:absolute;left:-9999px;" aria-hidden="true">
    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" />
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label for="name">{{ i18n "form_name" | default "Your Name" }} *</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="company">{{ i18n "form_company" | default "Company Name" }}</label>
      <input type="text" id="company" name="company">
    </div>
    <div class="form-group">
      <label for="email">{{ i18n "form_email" | default "Email" }} *</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="phone">{{ i18n "form_phone" | default "Phone / WhatsApp" }}</label>
      <input type="tel" id="phone" name="phone">
    </div>
    <div class="form-group">
      <label for="country">{{ i18n "form_country" | default "Country" }}</label>
      <input type="text" id="country" name="country">
    </div>
    <div class="form-group">
      <label for="product">{{ i18n "form_product" | default "Product Interest" }}</label>
      <select id="product" name="product">
        <option value="">-- Select Category --</option>
        <option value="Bidet Sprayers & Shattaf">Bidet Sprayers & Shattaf</option>
        <option value="Bathroom Accessories">Bathroom Accessories</option>
        <option value="Kitchen Faucets">Kitchen Faucets</option>
        <option value="Thermostatic Shower Sets">Thermostatic Shower Sets</option>
        <option value="LED Smart Mirrors">LED Smart Mirrors</option>
        <option value="PU Stone Wall Panels">PU Stone Wall Panels</option>
      </select>
    </div>
    <div class="form-group">
      <label for="quantity">{{ i18n "form_quantity" | default "Quantity Needed" }}</label>
      <select id="quantity" name="quantity">
        <option value="">-- Select Quantity --</option>
        <option value="50-200 pcs">50-200 pcs</option>
        <option value="200-500 pcs">200-500 pcs</option>
        <option value="500-1000 pcs">500-1000 pcs</option>
        <option value="1000-5000 pcs">1000-5000 pcs</option>
        <option value="5000+ pcs">5000+ pcs</option>
        <option value="Full container">Full container (20GP/40HQ)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="destination">{{ i18n "form_destination" | default "Destination Port" }}</label>
      <input type="text" id="destination" name="destination" placeholder="e.g. Jebel Ali, UAE">
    </div>
  </div>

  <div class="form-group full-width">
    <label for="message">{{ i18n "form_requirements" | default "Detailed Requirements" }} *</label>
    <textarea id="message" name="message" rows="4" required placeholder="{{ i18n "form_requirements_placeholder" | default "Please describe your requirements: finish, packaging, customization, etc." }}"></textarea>
  </div>

  <button type="submit" class="btn btn-primary btn-lg" id="submit-btn">
    {{ i18n "form_submit" | default "Send Inquiry" }}
  </button>
  <p class="form-note">{{ i18n "form_response_time" | default "We will respond within 24 hours with a detailed quotation." }}</p>

  <div id="form-status" role="alert" aria-live="polite" style="margin-top:15px;"></div>
</form>
