
<!-- Cookie Consent Banner - GDPR/CCPA/PDPL Compliance -->
<style>
.cookie-consent-banner {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(20, 20, 30, 0.97);
  color: #e0e0e0;
  padding: 20px 24px;
  z-index: 99999;
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-top: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  font-family: 'Inter', sans-serif;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
}
.cookie-consent-banner.show {
  display: flex;
}
.cookie-consent-banner p {
  margin: 0;
  font-size: 14px;
  line-height: 1.6;
  flex: 1;
}
.cookie-consent-banner a {
  color: #7eb8da;
  text-decoration: underline;
}
.cookie-consent-buttons {
  display: flex;
  gap: 12px;
  flex-shrink: 0;
}
.cookie-consent-buttons button {
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.25);
  background: transparent;
  color: #e0e0e0;
  transition: all 0.2s ease;
  min-width: 140px;
  text-align: center;
}
.cookie-consent-buttons button:hover {
  background: rgba(255,255,255,0.1);
}
.cookie-consent-buttons button.cookie-accept {
  background: #2a7a5f;
  border-color: #2a7a5f;
  color: #fff;
}
.cookie-consent-buttons button.cookie-accept:hover {
  background: #1f5c47;
}
@media (max-width: 768px) {
  .cookie-consent-banner {
    flex-direction: column;
    padding: 16px;
    gap: 14px;
  }
  .cookie-consent-buttons {
    width: 100%;
    flex-direction: column;
  }
  .cookie-consent-buttons button {
    width: 100%;
    min-width: unset;
  }
}
</style>

<div class="cookie-consent-banner" id="cookie-consent-banner">
  <p>We use cookies to enhance your browsing experience, serve personalized content, and analyze our traffic. By clicking "Accept All", you consent to our use of cookies. Read our <a href="/en/privacy-policy/">Privacy Policy</a> for more information.</p>
  <div class="cookie-consent-buttons">
    <button type="button" class="cookie-accept" id="cookie-accept-btn">Accept All</button>
    <button type="button" class="cookie-reject" id="cookie-reject-btn">Reject Non-Essential</button>
  </div>
</div>

<script>
(function() {
  'use strict';
  var banner = document.getElementById('cookie-consent-banner');
  var acceptBtn = document.getElementById('cookie-accept-btn');
  var rejectBtn = document.getElementById('cookie-reject-btn');
  
  function getConsent() {
    try {
      return localStorage.getItem('cookie_consent');
    } catch(e) { return null; }
  }
  
  function setConsent(value) {
    try {
      localStorage.setItem('cookie_consent', value);
    } catch(e) {}
  }
  
  function hideBanner() {
    banner.classList.remove('show');
  }
  
  function showBanner() {
    banner.classList.add('show');
  }
  
  // Show banner if no consent recorded
  if (!getConsent()) {
    setTimeout(showBanner, 800);
  }
  
  acceptBtn.addEventListener('click', function() {
    setConsent('accepted');
    hideBanner();
    // Load optional scripts here (analytics, etc.)
    document.dispatchEvent(new CustomEvent('cookieConsentGiven', { detail: 'accepted' }));
  });
  
  rejectBtn.addEventListener('click', function() {
    setConsent('rejected');
    hideBanner();
    document.dispatchEvent(new CustomEvent('cookieConsentGiven', { detail: 'rejected' }));
  });
  
  // Expose consent check for other scripts
  window.cookieConsentGiven = function() {
    return getConsent() === 'accepted';
  };
})();
</script>

<style>
.consent-group {
  margin-top: 16px;
}
.consent-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  line-height: 1.5;
  color: #555;
  cursor: pointer;
}
.consent-label input[type="checkbox"] {
  margin-top: 3px;
  flex-shrink: 0;
  width: 16px;
  height: 16px;
}
.consent-label a {
  color: #2a7a5f;
  text-decoration: underline;
}
</style>
