<div class="lang-switcher" id="langSwitcher">
  <button class="lang-toggle" id="langToggle" aria-label="Switch language" onclick="toggleLangDropdown()">
    <img src="https://flagcdn.com/16x12/{{ index $.Site.Params.langFlags .Language.Lang }}.png" width="16" height="12" alt="{{ .Language.LanguageName }}" class="lang-flag-img" />
    <span class="lang-name">{{ .Language.LanguageName }}</span>
    <svg class="lang-chevron" width="12" height="12" viewBox="0 0 12 12"><path d="M3 5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <div class="lang-dropdown" id="langDropdown">
    {{ $total := len .Site.Languages }}
    {{ $half := div (add $total 1) 2 }}
    <div class="lang-dropdown-cols">
      <div class="lang-dropdown-col">
        {{ range first $half .Site.Languages }}
        <a href="/{{ .Lang }}/" class="lang-item {{ if eq .Lang $.Language.Lang }}active{{ end }}">
          <img src="https://flagcdn.com/16x12/{{ index $.Site.Params.langFlags .Lang }}.png" width="16" height="12" alt="{{ .LanguageName }}" class="lang-flag-img" />
          <span class="lang-name">{{ .LanguageName }}</span>
        </a>
        {{ end }}
      </div>
      <div class="lang-dropdown-col">
        {{ range after $half .Site.Languages }}
        <a href="/{{ .Lang }}/" class="lang-item {{ if eq .Lang $.Language.Lang }}active{{ end }}">
          <img src="https://flagcdn.com/16x12/{{ index $.Site.Params.langFlags .Lang }}.png" width="16" height="12" alt="{{ .LanguageName }}" class="lang-flag-img" />
          <span class="lang-name">{{ .LanguageName }}</span>
        </a>
        {{ end }}
      </div>
    </div>
  </div>
</div>
